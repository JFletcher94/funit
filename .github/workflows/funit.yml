name: jfletcher94/funit
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
env:
  FACTORIO_VERSION: latest
  MOD_NAME: funit
  TIMEOUT: 60s
  USERNAME: "${{ secrets.USERNAME }}"
  TOKEN: "${{ secrets.TOKEN }}"

jobs:
  build-archive-job:
    runs-on: ubuntu-latest
    container:
      image: ruby:4-alpine
    timeout-minutes: 60
    outputs:
      factorio_version: ${{ env.FACTORIO_VERSION }}
    steps:
    - run: apk add --no-cache git jq
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        MOD_VERSION=$(jq -r '.version' "$MOD_NAME/info.json")
        FOLDER_NAME="${MOD_NAME}_${MOD_VERSION}"
        ARCHIVE_NAME="${FOLDER_NAME}.zip"
        echo "Building archive ${ARCHIVE_NAME}"
        mkdir -p artifacts/${MOD_NAME}/scenarios
        mkdir -p artifacts/${MOD_NAME}/test
        git archive --worktree-attributes --format=zip HEAD:"${MOD_NAME}" -o "artifacts/${MOD_NAME}/${ARCHIVE_NAME}" --prefix="${FOLDER_NAME}/"
        ls -1 "${MOD_NAME}"/test/saves/ 2>/dev/null > "artifacts/${MOD_NAME}/save_names.txt" || true
        ls -1 "${MOD_NAME}"/scenarios/ 2>/dev/null | grep "__funit__" > "artifacts/${MOD_NAME}/scenario_names.txt" || true
        # wget https://gitlab.com/jfletcher94/funit/-/raw/master/scripts/expand_dependencies.rb
        if [ -s "artifacts/${MOD_NAME}/scenario_names.txt" ]; then
          for scn in $(cat artifacts/${MOD_NAME}/scenario_names.txt); do
            cp -r "${MOD_NAME}/scenarios/$scn" "artifacts/${MOD_NAME}/scenarios/"
            if [ -s "artifacts/${MOD_NAME}/scenarios/$scn/mod-list.json" ]; then
              ruby scripts/expand_dependencies.rb -i "${MOD_NAME}/info.json" -m "artifacts/${MOD_NAME}/scenarios/$scn/mod-list.json" -o "artifacts/${MOD_NAME}/scenarios/$scn/mod-list.json"
            fi
          done
        fi
        if [ -s "${MOD_NAME}/test/mod-list.json" ]; then
          ruby scripts/expand_dependencies.rb -i "${MOD_NAME}/info.json" -m "${MOD_NAME}/test/mod-list.json" -o "artifacts/${MOD_NAME}/test/mod-list.json"
        fi
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        retention-days: 1
        path: artifacts/

  unit-test-job:
    needs: build-archive-job
    runs-on: ubuntu-latest
    container:
      image: "factoriotools/factorio:${{ needs.build-archive-job.outputs.factorio_version }}"
    timeout-minutes: 15
    env:
      UPDATE_MODS_ON_START: "true"
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
    - uses: actions/download-artifact@v4.1.0
      with:
        name: build-archive-job
        path: artifacts
    - name: Prepare test environment
      run: bash scripts/prepare_test_environment.sh
    - name: Run tests
      run: |
        mkdir -p "test_artifacts/${MOD_NAME}"
        (cd / && bash "$GITHUB_WORKSPACE/entrypoint.sh") \
          2>&1 | tee "$GITHUB_WORKSPACE/test_artifacts/${MOD_NAME}/funit.log"
    - name: Collect JSON reports
      if: always()
      run: |
        mkdir -p "test_artifacts/${MOD_NAME}/reports"
        if [ -d /factorio/script-output ]; then
          cp -a /factorio/script-output/. "test_artifacts/${MOD_NAME}/reports/"
        fi
    - uses: actions/upload-artifact@v4.1.0
      if: always()
      with:
        name: "${{ github.job }}"
        retention-days: 30
        path: test_artifacts
  
  parse-results-job:
    needs: unit-test-job
    if: ${{ !cancelled() && needs.unit-test-job.result != 'skipped' }}
    runs-on: ubuntu-latest
    container:
      image: ruby:4-alpine
    timeout-minutes: 60
    steps:
    - run: apk add --no-cache git
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
    - uses: actions/download-artifact@v4.1.0
      with:
        name: unit-test-job
        path: test_artifacts
    # - run: wget https://gitlab.com/jfletcher94/funit/-/raw/master/scripts/parse_funit_log.rb
    - run: ruby scripts/parse_funit_json.rb test_artifacts/${MOD_NAME}/reports -o funit-report-${MOD_NAME}.xml
    - uses: actions/upload-artifact@v4.1.0
      if: always()
      with:
        name: "${{ github.job }}"
        retention-days: 30
        path: funit-report-*.xml