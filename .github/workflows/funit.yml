name: jfletcher94/funit
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
env:
  FACTORIO_VERSION: stable
  MOD_NAME: funit
  TIMEOUT: 30s
  IMAGE_NAME: "$CI_REGISTRY/${{ github.repository }}/factorio-image"
  IMAGE_TAG: "$FACTORIO_VERSION-${{ github.ref }}"
  TOKEN: "${{ secrets.TOKEN }}"
  USERNAME: "${{ secrets.USERNAME }}"
  API_KEY: "${{ secrets.API_KEY }}"

jobs:
  build-archive-job:
    runs-on: ubuntu-latest
    container:
      image: ruby:4-alpine
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
    - name: Build archive
    - run: apk add --no-cache git jq
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        MOD_VERSION=$(jq -r '.version' "$MOD_NAME/info.json")
        FOLDER_NAME="${MOD_NAME}_${MOD_VERSION}"
        ARCHIVE_NAME="${FOLDER_NAME}.zip"
        echo "Building archive ${ARCHIVE_NAME}"
        mkdir -p artifacts/${MOD_NAME}/scenarios
        git archive --worktree-attributes --format=zip HEAD:"${MOD_NAME}" -o "artifacts/${MOD_NAME}/${ARCHIVE_NAME}" --prefix="${FOLDER_NAME}/"
        ls -1 "${MOD_NAME}"/test/saves/ 2>/dev/null > "artifacts/${MOD_NAME}/save_names.txt" || true
        ls -1 "${MOD_NAME}"/scenarios/ 2>/dev/null | grep "__funit__" > "artifacts/${MOD_NAME}/scenario_names.txt" || true
        # wget https://gitlab.com/jfletcher94/funit/-/raw/master/scripts/expand_dependencies.rb
        if [ -s "artifacts/${MOD_NAME}/scenario_names.txt" ]; then
          for scn in $(cat artifacts/${MOD_NAME}/scenario_names.txt); do
            cp -r "${MOD_NAME}/scenarios/$scn" "artifacts/${MOD_NAME}/scenarios/"
            if [ -s "artifacts/${MOD_NAME}/scenarios/$scn/mod-list.json" ]; then
              ruby scripts/expand_dependencies.rb -i "${MOD_NAME}/info.json" -m "artifacts/${MOD_NAME}/scenarios/$scn/mod-list.json" -o "artifacts/${MOD_NAME}/scenarios/$scn/mod-list.json"
            fi
          done
        fi
        if [ -s "${MOD_NAME}/test/mod-list.json" ]; then
          ruby scripts/expand_dependencies.rb -i "${MOD_NAME}/info.json" -m "${MOD_NAME}/test/mod-list.json" -o "${MOD_NAME}/test/mod-list.json"
        fi
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        retention-days: 1
        path: artifacts/${{ env.MOD_NAME }}/

  unit-test-job:
    needs: build-archive-job
    runs-on: ubuntu-latest
    container:
      image: docker:stable
    timeout-minutes: 15
    services:
      docker:dind:
        image: docker:dind
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
    - uses: actions/download-artifact@v4.1.0
    - run: apk add --no-cache bash
    - run: |
        docker build \
            --build-arg FACTORIO_VERSION=$FACTORIO_VERSION \
            --build-arg USERNAME="${USERNAME}" \
            --build-arg TOKEN="${TOKEN}" \
            --build-arg MOD_NAME="${MOD_NAME}" \
            -t $IMAGE_NAME:$IMAGE_TAG-${MOD_NAME} \
            .
        mkdir -p artifacts/${MOD_NAME}/reports
        set +e
        bash -c '
          docker run --rm \
              -e MOD_NAME=${MOD_NAME} \
              -e USERNAME="${USERNAME}" \
              -e TOKEN="${TOKEN}" \
              -e TIMEOUT=${TIMEOUT} \
              -v ${PWD}/artifacts/${MOD_NAME}/reports:/opt/factorio/script-output \
              $IMAGE_NAME:$IMAGE_TAG-${MOD_NAME} \
            2>&1 | tee artifacts/${MOD_NAME}/funit.log
          exit ${PIPESTATUS[0]}
        '
        EXIT_CODE=$?
        set -e
        exit $EXIT_CODE
    - uses: actions/upload-artifact@v4.1.0
      if: always()
      with:
        name: "${{ github.job }}"
        retention-days: 30
        path: |-
          artifacts/${{ env.MOD_NAME }}/funit.log
          artifacts/${{ env.MOD_NAME }}/reports/
  
  parse-results-job:
    needs: unit-test-job
    runs-on: ubuntu-latest
    container:
      image: ruby:4-alpine
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
    - uses: actions/download-artifact@v4.1.0
    - run: ruby scripts/parse_funit_json.rb artifacts/${MOD_NAME}/reports -o funit-report-${MOD_NAME}.xml
    - uses: actions/upload-artifact@v4.1.0
      if: always()
      with:
        name: "${{ github.job }}"
        retention-days: 30
        path: funit-report-*.xml

  deploy-job:
    needs:
    - build-archive-job
    - parse-results-job
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/gitlab-org/cli:latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
    - uses: actions/download-artifact@v4.1.0
    - run: apk add --no-cache jq curl
    - run: |
        MOD_VERSION=$(jq -r '.version' ${MOD_NAME}/info.json 2>/dev/null)
        MOD_ZIP=artifacts/${MOD_NAME}/${MOD_NAME}_${MOD_VERSION}.zip
        MOD_FILENAME=$(basename "$MOD_ZIP")
        PACKAGE_BASE_URL="${{ github.api_url }}/projects/${{ github.repository }}/packages/generic/${MOD_NAME}/${MOD_VERSION}"
        curl --header "JOB-TOKEN: ${{ github.token }}" --upload-file "${MOD_ZIP}" "${PACKAGE_BASE_URL}/${MOD_FILENAME}"
        UPLOAD_URL=$(curl -s -X POST \
            -H "Authorization: Bearer ${API_KEY}" \
            -F "mod=${MOD_NAME}" \
            https://mods.factorio.com/api/v2/mods/releases/init_upload \
          | jq -r '.upload_url') && \
        curl -X POST -F "file=@${MOD_ZIP}" "${UPLOAD_URL}"

  upload-readme-job:
    needs: build-archive-job
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/gitlab-org/cli:latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
    - uses: actions/download-artifact@v4.1.0
    - run: apk add --no-cache curl
    - run: |
        curl -X POST \
            -H "Authorization: Bearer ${API_KEY}" \
            -F "mod=${MOD_NAME}" \
            -F "description=<${MOD_NAME}/README.md" \
            https://mods.factorio.com/api/v2/mods/edit_details

